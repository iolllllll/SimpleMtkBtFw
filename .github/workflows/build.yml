name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout (with MacKernelSDK submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        run: |
          xcodebuild -version
          clang --version | head -1

      - name: Dependencies (Lilu SDK)
        run: ./scripts/bootstrap.sh

      - name: Version
        id: ver
        run: |
          # Kext bundle versions must be purely numeric (e.g. 1.1.0).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/.*MODULE_VERSION = \([0-9.]*\);.*/\1/p' SimpleMtkBtFw.xcodeproj/project.pbxproj | head -1)"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Invalid kext version '$VERSION' (use tags like v1.2.3)"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Debug and Release
        run: |
          for CONF in Debug Release; do
            for SCHEME in SimpleMtkBtFw SimpleMtkBtPatcher; do
              xcodebuild -project SimpleMtkBtFw.xcodeproj -scheme "$SCHEME" \
                -configuration "$CONF" -derivedDataPath build \
                MODULE_VERSION="${{ steps.ver.outputs.version }}" \
                CODE_SIGNING_ALLOWED=NO build
            done
          done
          # Build patched BlueToolFixup (MediaTek Sequoia & Tahoe)
          export MKS="$GITHUB_WORKSPACE/MacKernelSDK"
          export LILU="$GITHUB_WORKSPACE/Lilu.kext"
          bash ./BlueToolFixup-MediaTek/build.sh

      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          LILU_VERSION=1.7.2
          mkdir -p dist deps
          curl -fsSL -o deps/lilu.zip "https://github.com/acidanthera/Lilu/releases/download/${LILU_VERSION}/Lilu-${LILU_VERSION}-RELEASE.zip"
          ditto -x -k deps/lilu.zip deps/lilu
          LILU="$(find deps/lilu -maxdepth 2 -name Lilu.kext | head -1)"
          BTF="$GITHUB_WORKSPACE/BlueToolFixup-MediaTek/build-work/src/build/Products/Release/BlueToolFixup.kext"
          test -d "$LILU" && test -d "$BTF"
          for CONF in Debug Release; do
            UP="$(echo "$CONF" | tr '[:lower:]' '[:upper:]')"
            P="build/Build/Products/$CONF"
            # Only our kexts
            STAGE="$(mktemp -d)"
            cp -R "$P/SimpleMtkBtFw.kext" "$P/SimpleMtkBtPatcher.kext" "$STAGE/"
            (cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/dist/SimpleMtkBtFw-$V-$UP.zip" .)
            # Everything needed for Bluetooth, ready for EFI/OC/Kexts
            ALL="$(mktemp -d)/SimpleMtkBtFw-$V-$UP-AllInOne"
            mkdir -p "$ALL/Kexts" "$ALL/Firmware"
            cp -R "$LILU" "$BTF" "$P/SimpleMtkBtFw.kext" "$P/SimpleMtkBtPatcher.kext" "$ALL/Kexts/"
            cp SimpleMtkBtFw/fw/*.bin "$ALL/Firmware/"
            cp docs/config-snippet.plist docs/INSTALL.txt docs/INSTALL_RU.md "$ALL/"
            (cd "$(dirname "$ALL")" && zip -qry "$GITHUB_WORKSPACE/dist/SimpleMtkBtFw-$V-$UP-AllInOne.zip" "$(basename "$ALL")")
          done
          (cd dist && shasum -a 256 *.zip > SHA256SUMS.txt)
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpleMtkBtFw-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.short }}
          path: dist/*

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
